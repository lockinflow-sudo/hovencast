name: Share your receiver results
description: Tell us what works—or partly works—with your TV, streaming device and Wi-Fi adapter.
title: "[Compatibility]: "
labels:
  - compatibility
body:
  - type: markdown
    attributes:
      value: |
        Successful setups are useful too. Please report one receiver per issue. Apple TV / AirPlay is experimental and needs further hardware testing.
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Works
        - Partially works
        - Does not work
    validations:
      required: true
  - type: dropdown
    id: receiver
    attributes:
      label: Receiver type
      options:
        - Roku TV
        - Fire TV / Fire TV Stick
        - Google Cast / Chromecast
        - Apple TV / AirPlay (experimental)
        - Other / unsure
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Receiver brand and model
      description: Include the streaming device model if it is separate from the TV. Unknown is fine if you cannot find it.
      placeholder: TCL 32S331, Fire TV Stick model, Chromecast model, etc.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What worked, and what did not?
      description: A short report is enough. Mention connection, picture, audio, cursor response, and whether Stop/reconnect worked if you tried them.
    validations:
      required: true
  - type: checkboxes
    id: sources
    attributes:
      label: What did you test? (optional)
      options:
        - label: Separate TV workspace (Extend Display)
        - label: Full-screen sharing
        - label: Window sharing
        - label: Area sharing
        - label: Audio
        - label: Stop and reconnect
  - type: input
    id: version
    attributes:
      label: HovenCast and Omarchy versions (optional)
      description: HovenCast shows its version in the panel. Run `omarchy version` for the desktop version.
      placeholder: HovenCast 2.5.0; Omarchy version
  - type: input
    id: connection
    attributes:
      label: Connection and Wi-Fi adapter (optional)
      description: Same LAN or Wi-Fi Direct; adapter model if known. Do not include network addresses.
  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant log lines (optional)
      description: Include only the lines needed to understand the result. Remove PINs, credentials, addresses, usernames, and personal content.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Public report
      options:
        - label: I removed private information, pairing secrets, and sensitive screen content.
          required: true
