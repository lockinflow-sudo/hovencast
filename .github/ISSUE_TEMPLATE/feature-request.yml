name: Suggest an improvement
description: Tell us what would make HovenCast more useful or easier to use.
title: "[Idea]: "
body:
  - type: textarea
    id: need
    attributes:
      label: What are you trying to do?
      description: Describe the task or frustration in your own words. A proposed technical solution is not required.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help? (optional)
      description: Describe your idea or a workaround you currently use. Do not include private information.
